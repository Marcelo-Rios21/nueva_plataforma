spring.application.name=inscripciones-service
server.port=${SERVER_PORT:8081}

# Conexion Oracle Autonomous Database con TLS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:oracle.jdbc.OracleDriver}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.OracleDialect}

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_REGION}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Comunicacion con microservicios
services.cursos.url=${CURSOS_SERVICE_URL:http://localhost:8082}

# Microsoft Entra ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI:https://login.microsoftonline.com/0bca00cb-b642-4823-b0d8-b4435e501b77/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences[0]=${ENTRA_API_CLIENT_ID:5353f5c6-49a7-45f2-a25f-b77bb6bacf83}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# MQ - Resumen de inscripcion
app.mq.inscripcion.exchange=inscripciones.exchange
app.mq.inscripcion.queue=inscripciones.resumen.queue
app.mq.inscripcion.routing-key=inscripcion.resumen.creado