name: Build and Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Spring Boot project
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-aprendizaje:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-aprendizaje:latest

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-aprendizaje:latest

            docker network create plataforma-network 2>/dev/null || true

            docker rm -f plataforma-rabbitmq 2>/dev/null || true

            docker run -d \
              --name plataforma-rabbitmq \
              --restart unless-stopped \
              --network plataforma-network \
              -p 5672:5672 \
              -p 15672:15672 \
              -e RABBITMQ_DEFAULT_USER='${{ secrets.RABBITMQ_USERNAME }}' \
              -e RABBITMQ_DEFAULT_PASS='${{ secrets.RABBITMQ_PASSWORD }}' \
              rabbitmq:3-management

            docker rm -f plataforma-aprendizaje-container 2>/dev/null || true

            docker run -d \
              --name plataforma-aprendizaje-container \
              --restart unless-stopped \
              --network plataforma-network \
              -p 8080:8081 \
              -e DB_URL='${{ secrets.DB_URL }}' \
              -e DB_USERNAME='${{ secrets.DB_USERNAME }}' \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e DB_DRIVER='${{ secrets.DB_DRIVER }}' \
              -e PORT='8080' \
              -e AWS_REGION='${{ secrets.AWS_REGION }}' \
              -e AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}' \
              -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
              -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
              -e AWS_SESSION_TOKEN='${{ secrets.AWS_SESSION_TOKEN }}' \
              -e RABBITMQ_HOST='plataforma-rabbitmq' \
              -e RABBITMQ_PORT='5672' \
              -e RABBITMQ_USERNAME='${{ secrets.RABBITMQ_USERNAME }}' \
              -e RABBITMQ_PASSWORD='${{ secrets.RABBITMQ_PASSWORD }}' \
              ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-aprendizaje:latest

            docker ps
          EOF