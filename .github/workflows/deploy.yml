name: Build and Deploy Platform

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Java projects
        run: |
          chmod +x ./mvnw

          ./mvnw clean package -DskipTests
          ./mvnw -f curso-service/pom.xml clean package -DskipTests
          ./mvnw -f bff-service/pom.xml clean package -DskipTests
          ./mvnw -f api-gateway/pom.xml clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push inscripciones-service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-inscripciones-service:latest

      - name: Build and push curso-service
        uses: docker/build-push-action@v7
        with:
          context: ./curso-service
          file: ./curso-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-curso-service:latest

      - name: Build and push bff-service
        uses: docker/build-push-action@v7
        with:
          context: ./bff-service
          file: ./bff-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-bff-service:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v7
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-api-gateway:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-frontend:latest
          build-args: |
            VITE_ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }}
            VITE_ENTRA_SPA_CLIENT_ID=${{ secrets.ENTRA_SPA_CLIENT_ID }}
            VITE_ENTRA_API_SCOPE=${{ secrets.ENTRA_API_SCOPE }}
            VITE_API_BASE_URL=/api

      - name: Create production environment file
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}

          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

          ENTRA_ISSUER_URI: ${{ secrets.ENTRA_ISSUER_URI }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}

        run: |
          python3 - <<'PY'
          import json
          import os

          names = [
              "DOCKERHUB_USERNAME",
              "DB_URL",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_DRIVER",
              "AWS_REGION",
              "AWS_S3_BUCKET",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "RABBITMQ_USERNAME",
              "RABBITMQ_PASSWORD",
              "ENTRA_ISSUER_URI",
              "ENTRA_API_CLIENT_ID",
          ]

          missing = [
              name
              for name in names
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise SystemExit(
                  "Faltan secretos requeridos: " + ", ".join(missing)
              )

          values = {
              name: os.environ[name]
              for name in names
          }

          values["IMAGE_TAG"] = "latest"
          values["API_UPSTREAM"] = "http://api-gateway:8080"

          with open("deploy.env", "w", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(
                      f"{name}={json.dumps(value)}\n"
                  )
          PY

      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Copy deployment files to EC2
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key.pem \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p ~/plataforma"

          scp \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key.pem \
            docker-compose.prod.yml \
            deploy.env \
            "$EC2_USER@$EC2_HOST:~/plataforma/"

      - name: Deploy on EC2
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key.pem \
            "$EC2_USER@$EC2_HOST" << 'EOF'
              set -e

              if ! docker compose version >/dev/null 2>&1; then
                echo "Docker Compose no esta instalado. Instalando complemento..."

                DOCKER_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}"
                mkdir -p "$DOCKER_CONFIG/cli-plugins"

                ARCH="$(uname -m)"

                case "$ARCH" in
                  x86_64)
                    COMPOSE_ARCH="x86_64"
                    ;;
                  aarch64|arm64)
                    COMPOSE_ARCH="aarch64"
                    ;;
                  *)
                    echo "Arquitectura no soportada: $ARCH"
                    exit 1
                    ;;
                esac

                curl -fsSL \
                  "https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-${COMPOSE_ARCH}" \
                  -o "$DOCKER_CONFIG/cli-plugins/docker-compose"

                chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
              fi

              docker compose version

              cd ~/plataforma

              mv deploy.env .env
              chmod 600 .env

              docker compose \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.prod.yml \
                up -d \
                --remove-orphans

              docker image prune -f

              docker compose \
                -f docker-compose.prod.yml \
                ps
          EOF